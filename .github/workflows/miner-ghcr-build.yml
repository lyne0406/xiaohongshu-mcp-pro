name: Build isolated MiMo XHS miner MCP image

on:
  push:
    branches: [railway-miner-otp]
    paths:
      - "Dockerfile"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/miner-ghcr-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate GHCR with scoped Github token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish private-to-project candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/lyne0406/xiaohongshu-mcp-pro:railway-miner-otp
          cache-from: type=gha
          cache-to: type=gha,mode=max
