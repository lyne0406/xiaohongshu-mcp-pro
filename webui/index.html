<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小矿工 · 小红书小号登录</title><style>
body{font:16px/1.7 system-ui,-apple-system,sans-serif;max-width:650px;margin:35px auto;padding:0 18px;color:#24282c;background:#fafaf9}h1{font-size:25px}main{background:#fff;border:1px solid #e0e1df;border-radius:14px;padding:23px}label{display:block;margin-top:17px;font-weight:600}input{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #bbb;border-radius:8px}button{padding:11px 15px;margin:15px 10px 0 0;border:1px solid #9a9a9a;background:#f0f0f0;border-radius:8px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}#result{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f5f3;padding:12px;margin-top:18px;border-radius:9px;min-height:38px}img{max-width:100%;width:auto;margin-top:14px}.muted{color:#666;font-size:14px}
</style></head><body><h1>⛏️ 小矿工 · 小红书小号登录</h1><p class="muted">独立研究沙盒；不是小红书官方网站。此处仅用于你授权的小号登录，不连接 Castle。</p><main><label for="key">实验室访问口令</label><input id="key" type="password" autocomplete="off" placeholder="与原小矿工网页相同"><label for="phone">小号手机号</label><input id="phone" inputmode="tel" autocomplete="off" placeholder="11位手机号"><button id="send" onclick="send()">发送短信验证码</button><label for="code">收到的6位验证码</label><input id="code" inputmode="numeric" type="password" autocomplete="one-time-code" placeholder="短信验证码"><button id="verify" onclick="verify()">提交验证码</button><button onclick="progress()">查看登录进度</button><button onclick="status()">检查登录状态</button><div id="result">登录服务已启动。请先填写实验室口令和小号手机号。</div><div id="preview"></div><p class="muted">口令、手机号及验证码不会存入浏览器本地存储；验证码只发送给你自己的 Railway 登录网关。不要在聊天中发送短信验证码。</p></main>
<script>
const $=id=>document.getElementById(id);
function show(x){$('result').textContent=x;$('preview').textContent=''}
async function api(path,method,body){const headers={'X-Lab-Key':$('key').value};if(method==='POST')headers['Content-Type']='application/json';const r=await fetch(path,{method,headers,body:body?JSON.stringify(body):undefined,cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.message||'请求失败');return d}
function image(d){if(!d.image)return;const i=document.createElement('img');i.alt='小红书网页登录截图';i.src='data:image/png;base64,'+d.image;$('preview').append(i)}
async function send(){const b=$('send');b.disabled=true;show('正在打开小红书官方登录页面并请求短信……');try{const d=await api('/api/send','POST',{phone:$('phone').value});show(d.message||'验证码已请求');image(d)}catch(e){show(e.message)}finally{b.disabled=false}}
async function verify(){const b=$('verify');b.disabled=true;show('正在提交验证码……');try{const d=await api('/api/verify','POST',{code:$('code').value});$('code').value='';show(d.message||'云端正在确认登录')}catch(e){show(e.message)}finally{b.disabled=false}}
async function progress(){try{const d=await api('/api/progress','GET');show(d.phase+'：'+d.message);image(d)}catch(e){show(e.message)}}
async function status(){try{show('正在检查登录……');const d=await api('/api/status','GET');show(d.text||'状态检查已完成')}catch(e){show(e.message)}}
</script></body></html>
